<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Accueil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .stats {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .stat-box {
      border: 1px solid #ccc;
      padding: 15px 20px;
      border-radius: 6px;
      min-width: 180px;
    }
    .stat-box h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #555;
    }
    .stat-box .valeur {
      font-size: 28px;
      font-weight: bold;
    }
    .livres-liste {
      margin-top: 20px;
    }
    .livre-item {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }
    .livre-item:last-child {
      border-bottom: none;
    }
    .titre {
      font-weight: bold;
    }
    .categorie {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <h1>Bienvenue dans la bibliothèque</h1>

  <div class="stats">
    <div class="stat-box">
      <h3>Nombre total de livres</h3>
      <div id="total-livres" class="valeur">...</div>
    </div>
    <div class="stat-box">
      <h3>Livres disponibles</h3>
      <div id="livres-disponibles" class="valeur">...</div>
    </div>
  </div>

  <h2>Liste des livres</h2>
  <div id="liste-livres" class="livres-liste">Chargement...</div>

  <script type="module">
    import { supabase } from './config.js';

    async function chargerAccueil() {
      // Charger tous les livres
      const { data: livres, error } = await supabase
        .from('livres')
        .select('titre, categorie, disponible')
        .order('titre');

      if (error) {
        console.error(error);
        document.getElementById('liste-livres').textContent =
          'Erreur lors du chargement des livres.';
        return;
      }

      // Statistiques
      const total = livres.length;
      const disponibles = livres.filter(l => l.disponible).length;

      document.getElementById('total-livres').textContent = total;
      document.getElementById('livres-disponibles').textContent = disponibles;

      // Liste simplifiée
      const container = document.getElementById('liste-livres');
      container.innerHTML = '';

      if (livres.length === 0) {
        container.textContent = 'Aucun livre enregistré pour le moment.';
        return;
      }

      for (const livre of livres) {
        const div = document.createElement('div');
        div.className = 'livre-item';

        div.innerHTML = `
          <span class="titre">${livre.titre}</span>
          <span class="categorie">
            ${livre.categorie ? '— ' + livre.categorie : ''}
          </span>
        `;

        container.appendChild(div);
      }
    }

    chargerAccueil();
  </script>
</body>
    </html>
