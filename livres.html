<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Détail du livre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="connexion.html" id="btn-connexion">Connexion</a>
    <a href="#" id="btn-deconnexion" style="display:none;">Déconnexion</a>
    <a href="administration.html" id="lien-admin" style="display:none;">Administration</a>
    <span id="span-nom-utilisateur"></span>
  </nav>

  <h1>Détail du livre</h1>

  <div style="margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 6px;">
    <h3>Emprunter un livre par référence</h3>
    <label>
      Référence du livre (ou scan QR)
      <input type="text" id="livre-ref-input" placeholder="Ex: REF12345" />
    </label>
    <button type="button" id="btn-scan-livre">Scanner QR livre</button>
    <button type="button" id="btn-emprunter-ref">Emprunter ce livre</button>
    <div id="message-ref" style="margin-top: 8px;"></div>
  </div>

  <div id="contenu-livre">Chargement...</div>

  <script type="module">
    import { initMenu } from './js/commun.js';
    import { afficherLivre } from './js/livre.js';
    import { supabase } from './js/config.js';
    import { getUtilisateurCourant } from './js/auth.js';

    initMenu();
    afficherLivre();

    // --- Emprunt par référence / QR ---
    const btnScanLivre = document.getElementById('btn-scan-livre');
    const btnEmprunterRef = document.getElementById('btn-emprunter-ref');
    const messageRef = document.getElementById('message-ref');

    if (btnScanLivre && 'mediaDevices' in navigator) {
      btnScanLivre.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });

          const video = document.createElement('video');
          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.style.position = 'fixed';
          video.style.top = '0';
          video.style.left = '0';
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.background = '#000';
          video.style.zIndex = '9999';
          document.body.appendChild(video);

          await video.play();

          setTimeout(() => {
            alert(
              "Pointez la caméra sur le QR code du livre.
" +
              "Ensuite, saisissez manuellement la référence dans le champ ci-dessus."
            );
            stream.getTracks().forEach(track => track.stop());
            video.remove();
          }, 5000);
        } catch (err) {
          alert("Impossible d'accéder à la caméra : " + err.message);
        }
      });
    } else if (btnScanLivre) {
      btnScanLivre.style.display = 'none';
    }

    if (btnEmprunterRef) {
      btnEmprunterRef.addEventListener('click', async () => {
        if (!messageRef) return;
        messageRef.textContent = '';
        messageRef.style.color = 'black';

        const ref = document.getElementById('livre-ref-input').value.trim();
        if (!ref) {
          messageRef.textContent = 'Veuillez saisir une référence.';
          messageRef.style.color = 'red';
          return;
        }

        const info = await getUtilisateurCourant();
        if (!info) {
          messageRef.textContent = 'Vous devez vous connecter pour emprunter un livre.';
          messageRef.style.color = 'red';
          return;
        }

        const { user, profil } = info;
        if (!profil || profil.status !== 'active') {
          messageRef.textContent = "Votre compte n'est pas encore activé par l'administrateur.";
          messageRef.style.color = 'red';
          return;
        }

        const { data: livre, error: searchError } = await supabase
          .from('livres')
          .select('id, titre, disponible')
          .eq('numero_ref', ref)
          .single();

        if (searchError || !livre) {
          messageRef.textContent = 'Aucun livre trouvé avec cette référence.';
          messageRef.style.color = 'red';
          return;
        }

        if (!livre.disponible) {
          messageRef.textContent = 'Ce livre n'est pas disponible pour le moment.';
          messageRef.style.color = 'red';
          return;
        }

        const { error: insertError } = await supabase.from('emprunts').insert({
          user_id: user.id,
          livre_id: livre.id,
          statut: 'pending',
          date_retour_prevu: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString()
        });

        if (insertError) {
          console.error(insertError);
          messageRef.textContent = "Erreur lors de l'envoi de la demande d'emprunt.";
          messageRef.style.color = 'red';
        } else {
          messageRef.textContent =
            `Demande d'emprunt envoyée pour "${livre.titre}". En attente de validation.`;
          messageRef.style.color = 'green';
          document.getElementById('livre-ref-input').value = '';
        }
      });
    }
  </script>
</body>
</html>
