<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | ESP Antsiranana</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="site-title" href="index.html">ESP Antsiranana</a>

      <nav class="nav-menu">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="livre.html">Scanner un livre</a>
      </nav>

      <div class="nav-actions">
        <a id="btn-connexion" href="connexion.html" class="btn btn-outline">Connexion</a>
      </div>
    </div>
  </header>

  <main class="container narrow">
    <section class="auth-card">
      <p class="eyebrow blue">Espace membre</p>
      <h1>Connexion</h1>
      <p>Connectez-vous avec votre adresse e-mail et votre mot de passe.</p>

      <form id="form-connexion">
        <label>
          Adresse e-mail
          <input id="email" type="email" required autocomplete="email">
        </label>

        <label>
          Mot de passe
          <input id="password" type="password" required autocomplete="current-password">
        </label>

        <button type="submit">Se connecter</button>
        <p id="message" class="message"></p>
      </form>

      <p class="auth-bottom">
        Vous n’avez pas de compte ?
        <a href="inscription.html">Créer un compte</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    ESP Antsiranana — EIT 2 · Bibliothèque
  </footer>

  <script type="module">
    import { connecterUtilisateur } from './js/auth.js';

    const form = document.getElementById('form-connexion');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      message.textContent = '';
      message.className = 'message';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await connecterUtilisateur({ email, password });
        window.location.href = 'index.html';
      } catch (error) {
        message.textContent = error.message || 'Erreur lors de la connexion.';
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
