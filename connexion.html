<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="connexion.html" id="btn-connexion">Connexion</a>
    <a href="#" id="btn-deconnexion" style="display:none;">Déconnexion</a>
    <a href="administration.html" id="lien-admin" style="display:none;">Administration</a>
    <span id="span-nom-utilisateur"></span>
  </nav>

  <h1>Connexion</h1>

  <form id="form-connexion">
    <label>
      E-mail
      <input type="email" id="email" required />
    </label>

    <label>
      Mot de passe
      <input type="password" id="password" required />
    </label>

    <button type="submit">Se connecter</button>
    <div id="message" class="error"></div>
  </form>

  <p>
    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
  </p>

  <script type="module">
    import { initMenu } from './js/commun.js';
    import { connecterUtilisateur } from './js/auth.js';

    initMenu();

    const form = document.getElementById('form-connexion');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await connecterUtilisateur({ email, password });
        window.location.href = 'index.html';
      } catch (err) {
        message.textContent = err.message || "Erreur lors de la connexion.";
      }
    });
  </script>
</body>
</html>
