<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { max-width: 350px; margin: auto; }
    label { display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:4px; }
    button { margin-top:15px; padding:10px 20px; }
    .error { color:red; margin-top:10px; }
  </style>
</head>
<body>
  <h1>Connexion</h1>
  <form id="form-connexion">
    <label>
      E-mail
      <input type="email" id="email" required />
    </label>

    <label>
      Mot de passe
      <input type="password" id="password" required />
    </label>

    <button type="submit">Se connecter</button>
    <div id="message" class="error"></div>
  </form>

  <p>
    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
  </p>

  <script type="module">
    import { connecterUtilisateur } from './auth.js';

    const form = document.getElementById('form-connexion');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await connecterUtilisateur({ email, password });
        window.location.href = 'accueil.html';
      } catch (err) {
        message.textContent = err.message || "Erreur lors de la connexion.";
      }
    });
  </script>
</body>
</html>
