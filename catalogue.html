<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - Espantsiranana Catalogue</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="container">
    <div class="page-heading">
      <p class="eyebrow">Bibliothèque numérique</p>
      <h1>Catalogue des livres</h1>
      <p>Recherchez un livre par titre, auteur ou référence.</p>
    </div>

    <form id="form-recherche" class="search-form">
      <input
        id="recherche"
        type="search"
        placeholder="Titre, auteur ou référence..."
      >
      <button class="button" type="submit">Rechercher</button>
    </form>

    <div id="message"></div>
    <div id="resultats" class="books-grid"></div>
  </main>

  <footer id="footer"></footer>

  <script type="module" src="./js/catalogue.js"></script>
</body>
</html>
