<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue | ESP Antsiranana</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="site-title" href="index.html">ESP Antsiranana</a>

      <nav class="nav-menu">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="livre.html">Scanner un livre</a>
        <a id="lien-espace" class="hidden" href="espace.html">Mon espace</a>
        <a id="lien-admin" class="hidden" href="administration.html">Administration</a>
      </nav>

      <div class="nav-actions">
        <span id="nom-utilisateur" class="user-name hidden"></span>
        <a id="btn-connexion" class="btn btn-outline" href="connexion.html">Connexion</a>
        <button id="btn-deconnexion" class="btn btn-danger hidden" type="button">
          Déconnexion
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="eyebrow blue">Bibliothèque</p>
      <h1>Catalogue des livres</h1>
      <p>
        Cliquez sur un livre pour afficher ses informations et demander un
        emprunt.
      </p>
    </section>

    <section class="content-card">
      <label>
        Rechercher un livre
        <input
          id="recherche-livre"
          type="search"
          placeholder="Titre, auteur, catégorie ou référence"
        >
      </label>

      <div id="liste-livres" class="catalogue-grid">Chargement…</div>
    </section>
  </main>

  <footer class="site-footer">
    ESP Antsiranana — EIT 2 · Bibliothèque
  </footer>

  <script type="module">
    import { initMenu } from './js/commun.js';
    import { afficherCatalogue } from './js/catalogue.js';

    await initMenu();
    await afficherCatalogue();
  </script>
</body>
      </html>
