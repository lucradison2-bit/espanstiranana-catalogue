<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | ESP Antsiranana</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="site-title" href="index.html">ESP Antsiranana</a>

      <nav class="nav-menu">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="livre.html">Scanner un livre</a>
      </nav>

      <div class="nav-actions">
        <a href="connexion.html" class="btn btn-outline">Connexion</a>
      </div>
    </div>
  </header>

  <main class="container narrow">
    <section class="auth-card">
      <p class="eyebrow blue">Nouveau membre</p>
      <h1>Créer un compte</h1>
      <p>
        Après l’inscription, confirmez votre e-mail. Votre compte sera ensuite
        validé par un administrateur.
      </p>

      <form id="form-inscription">
        <div class="form-grid">
          <label>
            Prénom *
            <input id="first_name" type="text" required>
          </label>

          <label>
            Nom *
            <input id="last_name" type="text" required>
          </label>
        </div>

        <label>
          Adresse e-mail *
          <input id="email" type="email" required autocomplete="email">
        </label>

        <label>
          Mot de passe *
          <input
            id="password"
            type="password"
            required
            autocomplete="new-password"
            placeholder="8 caractères minimum, lettre + chiffre"
          >
        </label>

        <label>
          Numéro de carte d’identité
          <input
            id="carte_identite"
            type="text"
            placeholder="Facultatif — minimum 12 chiffres si renseigné"
          >
        </label>

        <label>
          Numéro de carte étudiant
          <input
            id="carte_etudiant"
            type="text"
            placeholder="Facultatif — numéro ou code QR"
          >
        </label>

        <button type="submit">Créer mon compte</button>
        <p id="message" class="message"></p>
      </form>

      <p class="auth-bottom">
        Vous avez déjà un compte ?
        <a href="connexion.html">Se connecter</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    ESP Antsiranana — EIT 2 · Bibliothèque
  </footer>

  <script type="module">
    import { inscrireUtilisateur } from './js/auth.js';

    const form = document.getElementById('form-inscription');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      message.textContent = '';
      message.className = 'message';

      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const carte_identite = document.getElementById('carte_identite').value.trim();
      const carte_etudiant = document.getElementById('carte_etudiant').value.trim();

      try {
        await inscrireUtilisateur({
          first_name,
          last_name,
          email,
          password,
          carte_identite,
          carte_etudiant
        });

        message.textContent =
          "Compte créé. Consultez votre e-mail, cliquez sur le lien de confirmation, puis attendez la validation d'un administrateur.";
        message.className = 'message success';

        form.reset();
      } catch (error) {
        message.textContent = error.message || "Erreur lors de l'inscription.";
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
