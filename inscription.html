<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription | ESP Antsiranana</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="site-title" href="index.html">ESP Antsiranana</a>

      <nav class="nav-menu">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="livre.html">Scanner un livre</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <section class="auth-card">
      <p class="eyebrow blue">Nouveau membre</p>
      <h1>Créer un compte</h1>

      <p>
        Confirmez votre e-mail puis attendez la validation d'un administrateur.
      </p>

      <form id="form-inscription">
        <label>
          Nom complet *
          <input
            id="full_name"
            type="text"
            required
            placeholder="Exemple : RAKOTO ou RAKOTO Jean"
          >
        </label>

        <label>
          Adresse e-mail *
          <input id="email" type="email" required>
        </label>

        <label>
          Mot de passe *
          <input
            id="password"
            type="password"
            required
            placeholder="8 caractères, lettre + chiffre"
          >
        </label>

        <label>
          Carte d'identité
          <input
            id="carte_identite"
            type="text"
            placeholder="Facultatif — 12 chiffres minimum"
          >
        </label>

        <label>
          Carte étudiant
          <input
            id="carte_etudiant"
            type="text"
            placeholder="Facultatif"
          >
        </label>

        <button type="submit">Créer mon compte</button>

        <p id="message" class="message"></p>
      </form>

      <p class="auth-bottom">
        Déjà un compte ?
        <a href="connexion.html">Se connecter</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    ESP Antsiranana — EIT 2 · Bibliothèque
  </footer>

  <script type="module">
    import { inscrireUtilisateur } from './js/auth.js';

    const form = document.querySelector('#form-inscription');
    const message = document.querySelector('#message');

    form.onsubmit = async (event) => {
      event.preventDefault();

      try {
        await inscrireUtilisateur({
          full_name: document.querySelector('#full_name').value,
          email: document.querySelector('#email').value,
          password: document.querySelector('#password').value,
          carte_identite: document.querySelector('#carte_identite').value,
          carte_etudiant: document.querySelector('#carte_etudiant').value
        });

        message.textContent =
          "Compte créé. Confirmez votre e-mail puis attendez la validation de l'administrateur.";

        message.className = 'message success';

        form.reset();
      } catch (error) {
        message.textContent = error.message;
        message.className = 'message error';
      }
    };
  </script>
</body>
</html>
