<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="connexion.html" id="btn-connexion">Connexion</a>
    <a href="#" id="btn-deconnexion" style="display:none;">Déconnexion</a>
    <a href="administration.html" id="lien-admin" style="display:none;">Administration</a>
    <span id="span-nom-utilisateur"></span>
  </nav>

  <h1>Inscription</h1>

  <form id="form-inscription">
    <label>
      Prénom
      <input type="text" id="first_name" required />
    </label>

    <label>
      Nom
      <input type="text" id="last_name" required />
    </label>

    <label>
      E-mail
      <input type="email" id="email" required />
    </label>

    <label>
      Mot de passe (≥8 caractères, 1 lettre + 1 chiffre)
      <input type="password" id="password" required />
    </label>

    <label>
      Numéro de carte d'identité (facultatif, ≥12 chiffres)
      <input type="text" id="carte_identite" />
    </label>

    <label>
      Numéro de carte étudiant (facultatif, lettres/chiffres ou QR)
      <input type="text" id="carte_etudiant" />
      <button type="button" id="btn-scan-carte">Scanner QR carte étudiant</button>
    </label>

    <button type="submit">S'inscrire</button>
    <div id="message" class="error"></div>
  </form>

  <p>
    Déjà un compte ? <a href="connexion.html">Se connecter</a>
  </p>

  <script type="module">
    import { initMenu } from './js/commun.js';
    import { inscrireUtilisateur } from './js/auth.js';

    initMenu();

    const form = document.getElementById('form-inscription');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';

      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const carte_identite = document.getElementById('carte_identite').value.trim();
      const carte_etudiant = document.getElementById('carte_etudiant').value.trim();

      try {
        await inscrireUtilisateur({
          email,
          password,
          first_name,
          last_name,
          carte_identite,
          carte_etudiant
        });

        alert("Inscription réussie. Vérifiez vos e-mails si nécessaire.");
        window.location.href = 'connexion.html';
      } catch (err) {
        message.textContent = err.message || "Erreur lors de l'inscription.";
      }
    });

    // --- Scan QR carte étudiant ---
    const btnScanCarte = document.getElementById('btn-scan-carte');
    if (btnScanCarte && 'mediaDevices' in navigator) {
      btnScanCarte.addEventListener('click', async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });

          const video = document.createElement('video');
          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.style.position = 'fixed';
          video.style.top = '0';
          video.style.left = '0';
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.background = '#000';
          video.style.zIndex = '9999';
          document.body.appendChild(video);

          await video.play();

          setTimeout(() => {
            alert(
              "Pointez la caméra sur le QR code de la carte étudiant.
" +
              "Ensuite, saisissez manuellement le code affiché dans le champ 'Numéro de carte étudiant'."
            );
            stream.getTracks().forEach(track => track.stop());
            video.remove();
          }, 5000);
        } catch (err) {
          alert("Impossible d'accéder à la caméra : " + err.message);
        }
      });
    } else if (btnScanCarte) {
      btnScanCarte.style.display = 'none';
    }
  </script>
</body>
</html>
