<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    form { max-width: 400px; margin: auto; }
    label { display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:4px; }
    button { margin-top:15px; padding:10px 20px; }
    .error { color:red; margin-top:10px; }
  </style>
</head>
<body>
  <h1>Inscription</h1>
  <form id="form-inscription">
    <label>
      Prénom
      <input type="text" id="first_name" required />
    </label>

    <label>
      Nom
      <input type="text" id="last_name" required />
    </label>

    <label>
      E-mail
      <input type="email" id="email" required />
    </label>

    <label>
      Mot de passe (≥8 caractères, 1 lettre + 1 chiffre)
      <input type="password" id="password" required />
    </label>

    <label>
      Numéro de carte d'identité (facultatif, ≥12 chiffres)
      <input type="text" id="carte_identite" />
    </label>

    <label>
      Numéro de carte étudiant (facultatif, lettres/chiffres ou QR)
      <input type="text" id="carte_etudiant" />
    </label>

    <button type="submit">S'inscrire</button>
    <div id="message" class="error"></div>
  </form>

  <p>
    Déjà un compte ? <a href="connexion.html">Se connecter</a>
  </p>

  <script type="module">
    import { inscrireUtilisateur } from './auth.js';

    const form = document.getElementById('form-inscription');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';

      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const carte_identite = document.getElementById('carte_identite').value.trim();
      const carte_etudiant = document.getElementById('carte_etudiant').value.trim();

      try {
        await inscrireUtilisateur({
          email,
          password,
          first_name,
          last_name,
          carte_identite,
          carte_etudiant
        });

        alert("Inscription réussie. Vérifiez vos e-mails si nécessaire.");
        window.location.href = 'connexion.html';
      } catch (err) {
        message.textContent = err.message || "Erreur lors de l'inscription.";
      }
    });
  </script>
</body>
</html>
